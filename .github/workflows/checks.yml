name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests (no platform credentials)
        run: python -m unittest discover -s tests -v
      - name: Check frontend syntax
        run: node --check web/connections.js
      - name: Check installer syntax in Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-connectors.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
